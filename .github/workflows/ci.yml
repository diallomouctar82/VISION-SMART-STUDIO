name: Vision Smart Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/ai-core-spec-kit-integration]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: AI Core multi-turn contract
        run: npm run test:spec-kit-contract

      - name: Mission cockpit roadmap contract
        run: npm run test:mission-cockpit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
